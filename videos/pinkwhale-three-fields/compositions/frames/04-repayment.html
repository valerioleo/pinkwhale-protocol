    <script>
      (function () {
        "use strict";
        var $ = function (id) { return document.getElementById("f04-repayment-" + id); };
        var headline = $("headline");
        var words = headline.querySelectorAll('[class~="f04-repayment-word"]');
        var card = $("card");
        var lines = [$("l1"), $("l2"), $("l3"), $("l4"), $("l5")];
        var span = $("span");
        var readout = $("readout");
        var amount = $("amount");
        var track = $("track");
        var fill = $("fill");
        var marker = $("marker");
        var tickStart = $("tick-start");
        var tickEnd = $("tick-end");
        var cap1 = $("cap1");
        var cap2 = $("cap2");

        var ENTER = "expo.out";      // ≈ cubic-bezier(0.23, 1, 0.32, 1)
        var RAIL_START = 2.8;
        var RAIL_END = 6.0;
        var RAIL_DUR = RAIL_END - RAIL_START;
        var RAIL_W = 780;
        var FROM = 100;
        var TO = 110;
        var STEPS_PER_SEC = 60;

        var tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0–1.0s): the Repayment card fills the stage; headline per-word.
        tl.fromTo($("index"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: ENTER }, 0);
        tl.fromTo(card, { opacity: 0, y: 12, scale: 0.98 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: ENTER }, 0.05);
        tl.fromTo(words, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.55, ease: ENTER, stagger: 0.06 }, 0.2);

        // Scene 2 (1.0–2.8s): five lines top to bottom, then the amount and the rail get ready.
        tl.fromTo(lines, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: ENTER, stagger: 0.1 }, 1.0);
        tl.fromTo(span, { backgroundColor: "rgba(138, 189, 171, 0)", color: "#343a43" }, { backgroundColor: "rgba(138, 189, 171, 0.22)", color: "#467A68", duration: 0.4, ease: ENTER }, 2.05);
        tl.fromTo(readout, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: ENTER }, 2.15);
        tl.fromTo(track, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: ENTER }, 2.3);
        tl.fromTo([tickStart, tickEnd], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: ENTER, stagger: 0.06 }, 2.36);
        tl.fromTo(marker, { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.4, ease: ENTER }, 2.45);

        // Scene 3 (2.8–6.0s): time is linear. Rail, marker and amount share one clock.
        tl.fromTo(fill, { scaleX: 0 }, { scaleX: 1, duration: RAIL_DUR, ease: "none" }, RAIL_START);
        tl.fromTo(marker, { x: 0 }, { x: RAIL_W, duration: RAIL_DUR, ease: "none", immediateRender: false }, RAIL_START);
        var steps = Math.round(RAIL_DUR * STEPS_PER_SEC);
        for (var i = 0; i <= steps; i += 1) {
          var p = i / steps;
          // A trailing zero-width joiner keeps the value a string: GSAP reads a bare
          // "105.00" as the number 105 and drops the decimals.
          tl.set(amount, { textContent: (FROM + (TO - FROM) * p).toFixed(2) + "\u200D" }, RAIL_START + RAIL_DUR * p);
        }

        // Scene 4 (6.0–8.0s): the two captions land; hold still at 110.00.
        tl.fromTo(cap1, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: ENTER }, 6.0);
        tl.fromTo(cap2, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: ENTER }, 6.8);
        tl.set({}, {}, 8);

        window.__timelines = window.__timelines || {};
        window.__timelines["04-repayment"] = tl;
      })();
