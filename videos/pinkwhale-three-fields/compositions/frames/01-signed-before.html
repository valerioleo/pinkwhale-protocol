    [id="f01-signed-before-card-head"] {

    [id="f01-signed-before-card-body"] {

    [class~="f01-signed-before-line"] {

    [class~="f01-signed-before-k"] {

    [id="f01-signed-before-caret"] {

    }
    /* token avatars in the typed code lines: 26px, 8px gap, -6px baseline shift */
    #root img[class~="f01-signed-before-avatar"] { /* #root: beat the #root * margin reset */
      display: none; /* shown by render() on the keystroke that reaches its token */
      width: 26px;
      height: 26px;
      margin-right: 8px;
      vertical-align: -6px;
      transform-origin: 50% 50%;
    }
    [class~="f01-signed-before-avatar-usdc"],
    [class~="f01-signed-before-cap-avatar-usdc"] { border-radius: 50%; }
    [class~="f01-signed-before-avatar-bayc"],
    [class~="f01-signed-before-cap-avatar-bayc"] { border-radius: 22%; }
    /* token avatars in the caption: 26px, 6px gap, -5px baseline shift */
    #root img[class~="f01-signed-before-cap-avatar"] {
      display: inline-block;
      width: 26px;
      height: 26px;
      margin-right: 6px;
      vertical-align: -5px;
    }

    /* ── footnote zone ── */
    [id="f01-signed-before-caption"] {
      position: absolute;
      left: 80px;
      top: 860px;
      width: 920px;
      font-family: "Inter", "Inter Symbols", sans-serif;
      font-weight: 400;
      font-size: 26px;
      line-height: 1.35;
      color: #737b87;
    }
  </style>

  <div data-hf-id="hf-dxx8" id="root" data-composition-id="01-signed-before" data-width="1080" data-height="1080" data-duration="4.6">
    <!-- The arrow is typed in mid-shot; drawing it once, invisibly, at t=0 loads the mono symbols face before the glyph is needed, so it never falls back. -->
    <span data-hf-id="hf-dlgq" id="f01-signed-before-glyph-preload" aria-hidden="true" style="position:absolute;left:0;top:0;opacity:0;pointer-events:none;font-family:'IBM Plex Mono', 'Plex Mono Symbols';font-size:27px;">→</span>
    <div data-hf-id="hf-pbq0" id="f01-signed-before-ground" class="clip" data-start="0" data-duration="4.6" data-track-index="0"></div>

    <div data-hf-id="hf-rkmq" id="f01-signed-before-stage" class="clip" data-start="0" data-duration="4.6" data-track-index="1">
      <div data-hf-id="hf-cxj9" id="f01-signed-before-index">01/06</div>

      <h1 data-hf-id="hf-ljka" id="f01-signed-before-headline"><span data-hf-id="hf-ht3z" class="f01-signed-before-word">You’ve</span> <span data-hf-id="hf-m2vc" class="f01-signed-before-word">signed</span> <span data-hf-id="hf-t3ro" class="f01-signed-before-word">this</span> <span data-hf-id="hf-dunj" class="f01-signed-before-word">before.</span></h1>

      <div data-hf-id="hf-0qje" id="f01-signed-before-card">
        <div data-hf-id="hf-29lb" id="f01-signed-before-card-head">OrderParameters</div>
        <div data-hf-id="hf-t4ar" id="f01-signed-before-card-body">
          <div data-hf-id="hf-y6vz" class="f01-signed-before-line"><span data-hf-id="hf-lsdf" class="f01-signed-before-k"></span><span data-hf-id="hf-qi9a" class="f01-signed-before-v"></span></div>
          <div data-hf-id="hf-jvtr" class="f01-signed-before-line"><span data-hf-id="hf-pvqb" class="f01-signed-before-k"></span><span data-hf-id="hf-w4c2" class="f01-signed-before-v"></span></div>
          <div data-hf-id="hf-jhiq" class="f01-signed-before-line"><span data-hf-id="hf-phfa" class="f01-signed-before-k"></span><span data-hf-id="hf-win3" class="f01-signed-before-v"><img data-hf-id="hf-v4h8" id="f01-signed-before-avatar-usdc" class="f01-signed-before-avatar f01-signed-before-avatar-usdc" src="assets/tokens/usdc.png" alt=""></span></div>
          <div data-hf-id="hf-j37p" class="f01-signed-before-line"><span data-hf-id="hf-p349" class="f01-signed-before-k"></span><span data-hf-id="hf-wwy4" class="f01-signed-before-v"><img data-hf-id="hf-99vk" id="f01-signed-before-avatar-bayc" class="f01-signed-before-avatar f01-signed-before-avatar-bayc" src="assets/tokens/bayc.png" alt=""></span></div>
          <div data-hf-id="hf-lvcw" class="f01-signed-before-line"><span data-hf-id="hf-oot8" class="f01-signed-before-k"></span><span data-hf-id="hf-xb95" class="f01-signed-before-v"></span></div>
          <div data-hf-id="hf-lh1v" class="f01-signed-before-line"><span data-hf-id="hf-oai7" class="f01-signed-before-k"></span><span data-hf-id="hf-xpk6" class="f01-signed-before-v"></span></div>
        </div>
      </div>
      <span data-hf-id="hf-eh10" id="f01-signed-before-caret"></span>

      <p data-hf-id="hf-7muj" id="f01-signed-before-caption">Bob offers <img data-hf-id="hf-wgdc" class="f01-signed-before-cap-avatar f01-signed-before-cap-avatar-usdc" src="assets/tokens/usdc.png" alt="">100 USDC for Alice’s <img data-hf-id="hf-p66k" class="f01-signed-before-cap-avatar f01-signed-before-cap-avatar-bayc" src="assets/tokens/bayc.png" alt="">ape. An ordinary Seaport order.</p>
    </div>
  </div>

  <script>
    (function () {
      var FRAME_ID = "01-signed-before";
      var DURATION = 4;
      var tl = gsap.timeline({ paused: true });

      var byId = function (s) { return document.getElementById("f" + FRAME_ID + "-" + s); };
      var root = byId("stage").parentNode;
      var q = function (cls) { return root.querySelectorAll('[class~="' + "f" + FRAME_ID + "-" + cls + '"]'); };

      var words = q("word");
      var card = byId("card");
      var caret = byId("caret");
      var caption = byId("caption");
      var lineEls = q("line");

      // ── Order fields (verbatim from onscreen; keys padded so values share one column) ──
      var KEY_COL = 15; // "consideration: " is the longest key
      var FIELDS = [
        ["offerer:", "bob"],
        ["zone:", "address(0)"],
        ["offer:", "[ 100 USDC ]"],
        ["consideration:", "[ BAYC #8263 → bob ]"],
        ["orderType:", "FULL_RESTRICTED"],
        ["zoneHash:", "0x0"],
      ];
      function padKey(k) {
        var s = k;
        while (s.length < KEY_COL) s += " ";
        return s;
      }

      // ── Token avatars: the <img> sits inside the value span, before char `at` ──
      // Text before/after it lives in two text nodes, so the avatar takes its
      // layout width on the keystroke that types the first char after it and the
      // caret (appended after the value span) stays on the frontier.
      var TOKENS = {
        2: { at: 2, img: byId("avatar-usdc") }, // "[ " | "100 USDC ]"
        3: { at: 2, img: byId("avatar-bayc") }, // "[ " | "BAYC #8263 → bob ]"
      };
      for (var li in TOKENS) {
        var tk = TOKENS[li];
        tk.pre = document.createTextNode("");
        tk.post = document.createTextNode("");
        tk.img.parentNode.insertBefore(tk.pre, tk.img);
        tk.img.parentNode.appendChild(tk.post);
      }
      function setValue(j, n) {
        var v = FIELDS[j][1];
        var tk = TOKENS[j];
        if (!tk) {
          lineEls[j].children[1].textContent = v.substring(0, n);
          return;
        }
        tk.pre.data = v.substring(0, Math.min(n, tk.at));
        tk.post.data = n > tk.at ? v.substring(tk.at, n) : "";
        tk.img.style.display = n > tk.at ? "inline-block" : "none";
      }

      // ── Discrete typing SEQUENCE, baked once at build time ──
      // Per line: the schema key lands in one jump (tab to the value column),
      // then Bob’s value types char by char with a deterministic keystroke rhythm.
      var T_CARD = 0.42;       // card rises
      var T_CARET_ON = 0.62;   // caret appears on line 1
      var T_TYPE = 0.78;       // first key lands
      var KEY_DWELL = 0.06;    // beat between key landing and first value char
      var VAL_STEP = 0.024;    // mean seconds per value char
      var LINE_GAP = 0.05;     // pause before the next line starts
      var RHYTHM = [1.0, 0.8, 1.25, 0.9, 1.1, 0.75, 1.2]; // fixed, deterministic
      var T_CARET_OFF = 3.06;  // caret stops (Scene 3)
      var T_CAPTION = 3.04;    // ~0.17s after the last keystroke (2.87s)
      var TYPING_GRACE = 0.14;

      var SEQ = [{ t: 0, line: 0, key: false, n: 0 }];
      var t = T_TYPE;
      var r = 0;
      for (var i = 0; i < FIELDS.length; i++) {
        SEQ.push({ t: t, line: i, key: true, n: 0 });
        t += KEY_DWELL;
        var v = FIELDS[i][1];
        for (var c = 1; c <= v.length; c++) {
          SEQ.push({ t: t, line: i, key: true, n: c });
          if (TOKENS[i] && c === TOKENS[i].at + 1) TOKENS[i].t = t; // avatar's keystroke tick
          t += VAL_STEP * RHYTHM[r++ % RHYTHM.length];
        }
        t += LINE_GAP;
      }
      var CHANGE_TIMES = SEQ.slice(1).map(function (e) { return e.t; });

      function stateAt(time) {
        for (var j = SEQ.length - 1; j >= 0; j--) {
          if (time >= SEQ[j].t) return SEQ[j];
        }
        return SEQ[0];
      }

      var lastKey = "";
      function renderText(s) {
        var key = s.line + "|" + s.key + "|" + s.n;
        if (key === lastKey) return; // DOM swap only on state change
        lastKey = key;
        for (var j = 0; j < lineEls.length; j++) {
          var kEl = lineEls[j].children[0];
          if (j < s.line) {
            kEl.textContent = padKey(FIELDS[j][0]);
            setValue(j, FIELDS[j][1].length);
          } else if (j === s.line) {
            kEl.textContent = s.key ? padKey(FIELDS[j][0]) : "";
            setValue(j, s.n);
          } else {
            kEl.textContent = "";
            setValue(j, 0);
          }
        }
        // caret rides the frontier: always right after the active line’s value
        if (caret.parentNode !== lineEls[s.line]) lineEls[s.line].appendChild(caret);
        // context-sensitive caret: key colour while parked on a bare key, value colour while typing a value
        caret.style.background = s.key && s.n === 0 ? "#59616E" : "#343A43";
      }

      function caretOpacity(time) {
        if (time < T_CARET_ON || time >= T_CARET_OFF) return 0;
        for (var j = 0; j < CHANGE_TIMES.length; j++) {
          var d = time - CHANGE_TIMES[j];
          if (d >= 0 && d < TYPING_GRACE) return 1; // solid while keys are landing
        }
        var x = time - T_CARET_ON;
        return Math.cos((2 * Math.PI * x) / 0.8) > -0.25 ? 1 : 0; // deterministic square-wave blink
      }

      function render(time) {
        renderText(stateAt(time));
        caret.style.opacity = String(caretOpacity(time));
      }

      // ── Scene 1 (0.0–0.8s): headline enters per word ──
      tl.fromTo(
        words,
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.5, ease: "expo.out", stagger: 0.06 },
        0.06
      );

      // ── Scene 2 (0.4–3.0s): card rises, six field lines type in ──
      tl.fromTo(
        card,
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.65, ease: "expo.out" },
        T_CARD
      );

      var driver = { t: 0 };
      render(0);
      tl.to(
        driver,
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: function () { render(driver.t); },
        },
        0
      );

      // Avatars arrive with their text: on the keystroke tick that types the
      // first char after them (display is toggled by render(); this is the settle).
      for (var tj in TOKENS) {
        tl.fromTo(
          TOKENS[tj].img,
          { opacity: 0, scale: 0.9 },
          { opacity: 1, scale: 1, duration: 0.18, ease: "expo.out" },
          TOKENS[tj].t
        );
      }

      // ── Scene 3 (3.0–4.0s): caption fades up, caret stops, held read ──
      tl.fromTo(
        caption,
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" },
        T_CAPTION
      );

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME_ID] = tl;
    })();
  </script>
