      <div data-hf-id="hf-vkpd" id="f02-three-fields-note"><span data-hf-id="hf-xd4x" class="f02-three-fields-nk">terms</span> = { <span data-hf-id="hf-10ok" class="f02-three-fields-nk">consideration:</span> [ <img data-hf-id="hf-wbi4" class="f02-three-fields-av f02-three-fields-usdc f02-three-fields-av-note" src="assets/tokens/usdc.png" alt="">USDC 100 → 110 → bob ], <span data-hf-id="hf-bmr0" class="f02-three-fields-nk">duration:</span> 30 days }</div>

      <svg data-hf-id="hf-zxg2" id="f02-three-fields-wire" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
        <path data-hf-id="hf-tzxc" id="f02-three-fields-wire-path" d="M 150 866 H 132 Q 122 866 122 856 V 689 Q 122 679 132 679 H 151" />
        <circle data-hf-id="hf-oiht" id="f02-three-fields-wire-dot" cx="151" cy="679" r="3" />
      </svg>

      <div data-hf-id="hf-vt1d" id="f02-three-fields-caption">Bob offers <img data-hf-id="hf-r10g" class="f02-three-fields-av f02-three-fields-usdc f02-three-fields-av-cap" src="assets/tokens/usdc.png" alt="">100 USDC for Alice’s <img data-hf-id="hf-gap8" class="f02-three-fields-av f02-three-fields-bayc f02-three-fields-av-cap" src="assets/tokens/bayc.png" alt="">ape. An ordinary Seaport order.</div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var P = "f02-three-fields-";
      var $ = function (id) { return document.getElementById(P + id); };
      var q = function (el, cls) { return el.querySelector('[class~="' + P + cls + '"]'); };
      var qa = function (el, cls) { return el.querySelectorAll('[class~="' + P + cls + '"]'); };

      var EO = "expo.out";      // entrances  ~ cubic-bezier(0.23, 1, 0.32, 1)
      var IO = "power3.inOut";  // on-screen moves ~ cubic-bezier(0.77, 0, 0.175, 1)
      var MUTED = "#737B87";
      var ADDED = "#286349";

      var tl = gsap.timeline({ paused: true });

      /* ---------- helpers ---------- */

      // a removed line: 1px strike draws, text mutes, tile fades under it
      function strike(row, at) {
        var k = q(row, "k"), v = q(row, "v");
        tl.fromTo(q(row, "strike"), { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, at);
        tl.fromTo(q(row, "rbg"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: EO }, at);
        tl.fromTo(q(row, "sign"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: EO }, at + 0.05);
        tl.fromTo(k, { color: "#59616E" }, { color: MUTED, duration: 0.3, ease: EO }, at);
        tl.fromTo(v, { color: "#343A43" }, { color: MUTED, duration: 0.3, ease: EO }, at);
      }

      // ...then it collapses: row 44 -> 28, text settles to 0.8
      function collapse(row, at) {
        tl.fromTo(row, { height: 44, lineHeight: "44px" }, { height: 28, lineHeight: "28px", duration: 0.45, ease: IO }, at);
        tl.fromTo(q(row, "txt"), { scale: 1 }, { scale: 0.8, duration: 0.45, ease: IO }, at);
        tl.fromTo(q(row, "sign"), { scale: 1 }, { scale: 0.8, duration: 0.45, ease: IO }, at);
      }

      // an added line expands in green beneath it
      function expand(row, h, at) {
        var txt = q(row, "txt");
        var lines = qa(row, "zl");
        tl.fromTo(row, { height: 0 }, { height: h, duration: 0.5, ease: IO }, at);
        tl.fromTo(q(row, "rbg"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: EO }, at);
        tl.fromTo(q(row, "rbar"), { scaleY: 0 }, { scaleY: 1, duration: 0.45, ease: EO }, at + 0.05);
        tl.fromTo(q(row, "sign"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: EO }, at + 0.15);
        if (lines.length) {
          tl.fromTo(txt, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, at + 0.15);
          tl.fromTo(lines, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: EO, stagger: 0.06 }, at + 0.15);
        } else {
          tl.fromTo(txt, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: EO }, at + 0.15);
        }
      }

      // margin label: numeral, then its words
      function label(el, at) {
        tl.fromTo([q(el, "num"), q(el, "ltxt")], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: EO, stagger: 0.06 }, at);
      }

      /* ---------- Scene 1 (0.0–0.8): headline blur-crossfade, caption fades ---------- */
      tl.fromTo($("h-old"), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(4px)", duration: 0.14, ease: "power1.out" }, 0.24);
      tl.fromTo($("h-new"), { opacity: 0, filter: "blur(4px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.22, ease: EO }, 0.3);
      tl.fromTo($("caption"), { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.out" }, 0.34);

      /* ---------- Scene 2 (0.8–2.8): ① zone ---------- */
      var zoneOld = $("r-zone-old");
      strike(zoneOld, 0.85);
      collapse(zoneOld, 1.2);
      expand($("r-zone-new"), 44, 1.45);
      label($("l1"), 1.9);

      /* ---------- Scene 3 (2.8–4.8): ② recipient token, in place ---------- */
      var TOKEN = [
        { t: 0.0, text: "bob" },
        { t: 3.3, text: "bo" },
        { t: 3.38, text: "b" },
        { t: 3.46, text: "" },
        { t: 3.78, text: "p" },
        { t: 3.86, text: "pi" },
        { t: 3.93, text: "pin" },
        { t: 4.03, text: "pink" },
        { t: 4.11, text: "pinkw" },
        { t: 4.18, text: "pinkwh" },
        { t: 4.26, text: "pinkwha" },
        { t: 4.33, text: "pinkwhal" },
        { t: 4.4, text: "pinkwhale" }
      ];
      var CARET_ON = 2.9, TYPE_START = 3.26, TYPE_END = 4.42, CARET_OFF = 4.5;
      var tokEl = $("tok"), caretEl = $("caret"), tokMark = $("tok-mark");

      function tokenAt(t) {
        for (var i = TOKEN.length - 1; i >= 0; i--) {
          if (t >= TOKEN[i].t) return TOKEN[i].text;
        }
        return TOKEN[0].text;
      }
      function caretAt(t) {
        if (t < CARET_ON || t >= CARET_OFF) return 0;
        if (t >= TYPE_START && t < TYPE_END) return 1;          // solid while typing
        return Math.floor((t - CARET_ON) / 0.3) % 2 === 0 ? 1 : 0; // deterministic blink
      }
      function renderEdit(t) {
        var s = tokenAt(t);
        if (tokEl.textContent !== s) tokEl.textContent = s;
        var md = s.charAt(0) === "p" ? "inline-block" : "none"; // the mark belongs to "pinkwhale", never to "bob"
        if (tokMark.style.display !== md) tokMark.style.display = md;
        caretEl.style.opacity = String(caretAt(t));
      }
      var drv = { t: 0 };
      tl.fromTo(drv, { t: 0 }, { t: 9, duration: 9, ease: "none", onUpdate: function () { renderEdit(drv.t); } }, 0);
      renderEdit(0);
      // the whale arrives on the tick the "p" is typed (3.78), with its word
      tl.fromTo(tokMark, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.18, ease: EO }, 3.78);

      // the line becomes an added line
      var con = $("r-consideration");
      tl.fromTo(q(con, "rbg"), { opacity: 0 }, { opacity: 1, duration: 0.35, ease: EO }, 4.48);
      tl.fromTo(q(con, "rbar"), { scaleY: 0 }, { scaleY: 1, duration: 0.45, ease: EO }, 4.5);
      tl.fromTo(q(con, "sign"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: EO }, 4.55);
      tl.fromTo(q(con, "k"), { color: "#59616E" }, { color: ADDED, duration: 0.3, ease: EO }, 4.48);
      tl.fromTo(q(con, "v"), { color: "#343A43" }, { color: ADDED, duration: 0.3, ease: EO }, 4.48);
      label($("l2"), 4.6);

      /* ---------- Scene 4 (4.8–7.2): ③ terms hashed into zoneHash ---------- */
      var hashOld = $("r-hash-old");
      strike(hashOld, 4.85);
      collapse(hashOld, 5.15);

      tl.fromTo($("note"), { opacity: 0, x: -48 }, { opacity: 1, x: 0, duration: 0.7, ease: IO }, 5.3);

      var wire = $("wire-path");
      var len = wire.getTotalLength() * 1.02;
      wire.style.strokeDasharray = String(len);
      // +2: start 2px into the gap so no round cap is painted at the path's start before the draw
      tl.fromTo(wire, { strokeDashoffset: len + 2 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 5.95);
      tl.fromTo($("wire-dot"), { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: EO }, 6.37);

      expand($("r-hash-new"), 112, 6.15);
      label($("l3"), 6.75);

      /* ---------- Scene 5 (7.2–9.0): held read — nothing moves ---------- */

      window.__timelines = window.__timelines || {};
      window.__timelines["02-three-fields"] = tl;
    })();
  </script>
