  <script>
    (function () {
      var ID = "05-empty-array";
      var root = document.querySelector('[data-composition-id="' + ID + '"]');
      function el(id) {
        return root.querySelector('[id="f' + ID + "-" + id + '"]');
      }
      var world = el("world");
      var words = root.querySelectorAll('[class~="f05-empty-array-word"]');

      // ── Camera (viewport-change, single-wrapper form: T = -offset × S) ──
      // The layout is fixed-width by construction (15ch key column at 27px Plex Mono = 243px,
      // 50px [] tile), so the hero phrase’s world box is exact:
      //   card x 150 + pad 28 = 178 → phrase 178..471 (293px), line 2 centre y = 250+56+24+44+22 = 396.
      var CX = 540, CY = 540;
      var PHRASE_W = 293;
      var PHRASE_CX = 178 + PHRASE_W / 2; // 324.5
      var PHRASE_CY = 396;
      var S0 = (0.6 * 1080) / PHRASE_W; // phrase fills ~60% of the width at open (≈2.21×)
      var OPEN_Y = 454; // phrase centred on screen at y≈454
      var TX0 = -(PHRASE_CX - CX) * S0; // horizontally centred
      var TY0 = OPEN_Y - CY - (PHRASE_CY - CY) * S0;

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0–1.6): held, still — `consideration: []` alone at hero size.
      // Everything else in the world starts hidden (the fromTo entrances below render their
      // opacity-0 start state immediately, so a seek to t=0 shows the token alone).

      // Scene 2 (1.6–3.6): ONE continuous decelerating pull-back to the whole Default card.
      // Scale + counter-translate live in ONE tween on the world wrapper; GSAP composes them as
      // translate(x, y) scale(s) about the 540/540 origin, so screen = 540 + s·offset + T and the
      // phrase interpolates from its hero pose to its home line with no drift. Driven by tween
      // properties (not onUpdate) so a seek with suppressed events still lands the camera.
      tl.fromTo(
        world,
        { x: TX0, y: TY0, scale: S0, transformOrigin: "540px 540px", force3D: false },
        { x: 0, y: 0, scale: 1, transformOrigin: "540px 540px", force3D: false, duration: 2.0, ease: "power4.out" },
        1.6
      );
      // the card resolves around the token as the camera recedes (opacity only — the camera owns motion)
      tl.fromTo(el("chrome"), { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.out" }, 1.7);
      tl.fromTo([el("l1"), el("l3")], { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 1.76);
      tl.fromTo(el("l4"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 1.82);
      tl.fromTo(el("l5"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 1.88);
      tl.fromTo(el("l6"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 1.94);

      // Scene 3 (3.6–6.2): two-window rail builds left → right; caption fades up.
      tl.fromTo(
        el("seg-go"),
        { clipPath: "inset(0% 100% 0% 0% round 5px)" },
        { clipPath: "inset(0% 0% 0% 0% round 5px)", duration: 0.75, ease: "none" },
        3.7
      );
      tl.fromTo(el("lbl-go"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 4.1);
      tl.fromTo(el("seam"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 4.5);
      tl.fromTo(el("plus"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 4.55);
      tl.fromTo(
        el("seg-claim"),
        { clipPath: "inset(0% 100% 0% 0% round 5px)" },
        { clipPath: "inset(0% 0% 0% 0% round 5px)", duration: 0.85, ease: "none" },
        4.7
      );
      tl.fromTo(el("lbl-claim"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 5.1);
      tl.fromTo(el("caption"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 5.55);

      // Scene 4 (6.2–9.0): headline per-word, then the [] tile deepens once; hold still.
      tl.fromTo(
        words,
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.6, ease: "expo.out", stagger: 0.055 },
        6.3
      );
      var lastWord = 6.3 + (words.length - 1) * 0.055;
      tl.fromTo(
        el("tile"),
        { backgroundColor: "rgba(194, 169, 135, 0.18)" },
        { backgroundColor: "rgba(194, 169, 135, 0.36)", duration: 0.45, ease: "power2.out" },
        lastWord + 0.12
      );

      // pin the timeline length to the frame’s 9s (the tail is a held read)
      tl.to({}, { duration: 0 }, 9);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
