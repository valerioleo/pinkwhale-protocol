    <script>
      (function () {
        var g = function (id) { return document.getElementById("f03-match-" + id); };
        var EO = "expo.out";      // entrances ≈ cubic-bezier(0.23,1,0.32,1)
        var IO = "power3.inOut";  // on-screen moves ≈ cubic-bezier(0.77,0,0.175,1)

        var tl = gsap.timeline({ paused: true });

        gsap.set([g("full"), g("bob")], { transformOrigin: "0% 0%" });

        // ── Scene 1 (0.0–1.2s): the diffed order compacts; Alice’s mirror arrives ──
        var K = 448 / 780; // full card → compact width
        tl.fromTo(g("full"), { x: 0, y: 0, scale: 1 }, { x: -70, y: -60, scale: K, duration: 0.85, ease: IO }, 0.1);
        tl.fromTo(g("bob"), { x: 70, y: 60, scale: 1 / K }, { x: 0, y: 0, scale: 1, duration: 0.85, ease: IO }, 0.1);
        tl.fromTo(g("bob"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 0.2);
        tl.fromTo(g("full"), { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power1.out" }, 0.42);

        tl.fromTo(g("head"),
          { opacity: 0, y: 10, filter: "blur(4px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: EO }, 0.2);

        tl.fromTo(g("alice"), { opacity: 0, x: 18 }, { opacity: 1, x: 0, duration: 0.55, ease: EO }, 0.62);

        // ── Scene 2 (1.2–4.2s): executeLoan opens; three checks tick off ~0.8s apart ──
        tl.fromTo(g("panel"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.55, ease: EO }, 1.2);

        [1, 2, 3].forEach(function (n, i) {
          var t = 1.65 + i * 0.8;
          tl.fromTo(g("r" + n), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: EO }, t);
          tl.fromTo(g("rt" + n), { color: "#737B87" }, { color: "#343A43", duration: 0.22, ease: "power1.out" }, t + 0.34);
          tl.fromTo(g("ring" + n), { stroke: "#DADDE2", fill: "#FFFFFF" }, { stroke: "#28A36B", fill: "#EAF6EE", duration: 0.22, ease: "power1.out" }, t + 0.3);
          tl.fromTo(g("tick" + n), { strokeDashoffset: 13 }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, t + 0.34);
        });

        // ── Scene 3 (4.2–5.8s): matchAdvancedOrders; the assets travel ──
        tl.fromTo(g("r4"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: EO }, 4.2);
        tl.fromTo(g("sub"), { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4, ease: EO }, 4.27);
        tl.fromTo(g("badge"), { scale: 0.92 }, { scale: 1, duration: 0.45, ease: EO }, 4.27);

        tl.fromTo(g("chip-usdc"), { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.25, ease: EO }, 4.45);
        tl.fromTo(g("chip-bayc"), { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.25, ease: EO }, 4.51);
        // short ease-in-out paths: x and y on different in-out curves → a gentle arc
