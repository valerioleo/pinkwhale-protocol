    <script>
      (function () {
        var ID = "06-guard";
        var root = document.querySelector('[data-composition-id="06-guard"]') || document;
        function $(id) { return root.querySelector('[id="' + id + '"]'); }
        function $$(cls, scope) { return (scope || root).querySelectorAll('[class~="' + cls + '"]'); }

        var ENTER = "expo.out";      // ~ cubic-bezier(0.23, 1, 0.32, 1)
        var MOVE = "power3.inOut";   // ~ cubic-bezier(0.77, 0, 0.175, 1)

        var tl = gsap.timeline({ paused: true });

        // ---------------- Scene 1 (0.0–2.8s): scenario strip, waterfall-entry ----------------
        // Each line cascades word by word from below (binary opacity via set, whip to rest on
        // power4.out). Lines land ~0.8s apart; the first word of each line is the anchor.
        var lines = $$("f06-guard-line");
        var words = $$("f06-guard-word");
        tl.set(words, { opacity: 0 }, 0);
        var lineStarts = [0.12, 0.92, 1.72];
        for (var li = 0; li < lines.length; li++) {
          var ws = $$("f06-guard-word", lines[li]);
          var t = lineStarts[li];
          for (var wi = 0; wi < ws.length; wi++) {
            var anchor = wi === 0;
            var last = wi === ws.length - 1;
            var off = anchor ? 30 : last ? 26 : 20;
            var dur = anchor ? 0.2 : last ? 0.2 : 0.16;
            tl.set(ws[wi], { opacity: 1, y: off }, t);
            tl.to(ws[wi], { y: 0, duration: dur, ease: "power4.out" }, t);
            // gaps shrink across the cascade; the final word snaps in
            t += anchor ? 0.075 : Math.max(0.045, 0.065 - wi * 0.003);
          }
        }

        // ---------------- Scene 2 (2.8–5.2s): the card rises, the band sweeps ----------------
        var card = $("f06-guard-card");
        tl.fromTo(card,
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.65, ease: ENTER }, 2.8);

        var rows = $$("f06-guard-row");
        tl.fromTo(rows,
          { opacity: 0, y: 8 },
          { opacity: 1, y: 0, duration: 0.4, ease: ENTER, stagger: 0.05 }, 2.9);

        var b1 = $("f06-guard-b1"), b2 = $("f06-guard-b2"), b3 = $("f06-guard-b3");
        var band = $("f06-guard-band"), bar = $("f06-guard-band-bar"), trace = $("f06-guard-trace");

        // code-highlight sweep: band wipes across the getOrderStatus statement, rest dims to ~50%
        tl.fromTo(band,
          { clipPath: "inset(0% 100% 0% 0%)" },
          { clipPath: "inset(0% 0% 0% 0%)", duration: 0.7, ease: MOVE }, 3.55);
        tl.fromTo([b1, b3],
          { opacity: 1 },
          { opacity: 0.5, duration: 0.7, ease: MOVE }, 3.55);

        // ...then travels down to the `if` statement; the checked line keeps a quiet trace bar
        tl.fromTo(band, { y: 0 }, { y: 112, duration: 0.7, ease: MOVE }, 4.45);
        // second tween on b3's opacity: don’t let its from-state render at build time
        tl.fromTo(b3, { opacity: 0.5 }, { opacity: 1, duration: 0.7, ease: MOVE, immediateRender: false }, 4.45);
        tl.fromTo(b2, { opacity: 1 }, { opacity: 0.82, duration: 0.7, ease: MOVE }, 4.45);
        tl.fromTo(trace, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: MOVE }, 4.75);

        // ---------------- Scene 3 (5.2–6.6s): the revert chip stamps ----------------
        tl.fromTo(band,
          { backgroundColor: "#EDF5F1" },
          { backgroundColor: "#FDF0E9", duration: 0.3, ease: ENTER }, 5.2);
        tl.fromTo(bar,
          { backgroundColor: "#8ABDAB" },
          { backgroundColor: "rgba(194, 65, 12, 0.55)", duration: 0.3, ease: ENTER }, 5.2);
        tl.fromTo($("f06-guard-chip"),
          { opacity: 0, scale: 0.96 },
          { opacity: 1, scale: 1, duration: 0.4, ease: ENTER }, 5.25);

        // ---------------- Scene 4 (6.6–9.0s): caption fades up, hold ----------------
        tl.fromTo($("f06-guard-caption"),
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.5, ease: ENTER }, 6.6);

        // pad to the full frame length
        tl.to({}, { duration: 9 }, 0);

        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      })();
